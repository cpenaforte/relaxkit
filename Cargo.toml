[package]
name = "relaxkit"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Sets up and manages a curated set of agent tools on Linux and macOS"

[lib]
name = "relaxkit"
path = "src/lib.rs"

[[bin]]
name = "relaxkit"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
directories = "6.0.0"
include_dir = "0.7.4"
jsonc-parser = { version = "0.34.0", features = ["cst"] }
minisign-verify = "0.3.0"
reqwest = { version = "0.13.5", features = ["blocking", "rustls"] }
self-replace = "1.5.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "1.2.2"
toml_edit = "0.25.20"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
