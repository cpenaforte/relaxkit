# Serena runs with --project-from-cwd, so it may write .serena/ inside a repo. The owner accepts that (spec commit 4354020),
# and the recipe sets no workdir.
# The version is the newest release of [version], resolved at install. Updates reinstall (spike A I6), so an update mirrors install and reruns
# `serena init`, which must be safe to run again.
# OpenCode is a terminal client, so its entry uses `--context ide` (spec section 5.1, ruling K9).
id = "serena"
title = "Serena"
kind = "mcp"
hosts = ["claude", "opencode"]
needs_login = false
telemetry_default_off = true

[version]
pypi = "serena-agent"

[env]
SERENA_USAGE_REPORTING = "false"

[minimum_host]
claude = "2.1.330"
opencode = "2.2.6"

[[install.claude]]
exec = ["uv", "tool", "install", "-p", "3.13", "serena-agent=={version}"]

[[install.claude]]
handler = "serena_init"

[[install.claude]]
mcp = "serena"
argv = ["serena", "start-mcp-server", "--context", "claude-code", "--project-from-cwd", "--enable-web-dashboard", "False"]

[[install.opencode]]
exec = ["uv", "tool", "install", "-p", "3.13", "serena-agent=={version}"]

[[install.opencode]]
handler = "serena_init"

[[install.opencode]]
mcp = "serena"
argv = ["serena", "start-mcp-server", "--context", "ide", "--project-from-cwd", "--enable-web-dashboard", "False"]

[[update.claude]]
exec = ["uv", "tool", "install", "-p", "3.13", "serena-agent=={version}"]

[[update.claude]]
handler = "serena_init"

[[update.claude]]
mcp = "serena"
argv = ["serena", "start-mcp-server", "--context", "claude-code", "--project-from-cwd", "--enable-web-dashboard", "False"]

[[update.opencode]]
exec = ["uv", "tool", "install", "-p", "3.13", "serena-agent=={version}"]

[[update.opencode]]
handler = "serena_init"

[[update.opencode]]
mcp = "serena"
argv = ["serena", "start-mcp-server", "--context", "ide", "--project-from-cwd", "--enable-web-dashboard", "False"]

[probe.claude]
argv = ["serena", "--help"]

[probe.opencode]
argv = ["serena", "--help"]
