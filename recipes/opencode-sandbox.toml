# The live probe (spike B SB-1) gates Task 25. Config path and `.opencode/` write denial are Task 17 (owner decision O6).
# This is a thin dependency with one maintainer. It is pinned exactly and moved only after the self-test passes.
id = "opencode-sandbox"
title = "OpenCode Sandbox"
kind = "plugin"
hosts = ["opencode"]
needs_login = false
telemetry_default_off = true

[version]
npm = "opencode-sandbox"
pin = "0.7.0"

[minimum_host]
opencode = "2.2.6"

[[install.opencode]]
plugin = "opencode-sandbox@{version}"

[[install.opencode]]
handler = "opencode_sandbox_config"

[probe.opencode]
argv = ["opencode", "--version"]
