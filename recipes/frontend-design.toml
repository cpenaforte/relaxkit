# The marketplace is resolved on each install by the claude_marketplace handler, never hard-coded.
id = "frontend-design"
title = "Frontend Design"
kind = "plugin"
hosts = ["claude"]
needs_login = false
telemetry_default_off = true

[minimum_host]
claude = "2.1.330"

[[install.claude]]
handler = "claude_marketplace"

[[install.claude]]
plugin = "frontend-design@{marketplace}"

[probe.claude]
argv = ["claude", "plugin", "list"]
expect = "frontend-design"
