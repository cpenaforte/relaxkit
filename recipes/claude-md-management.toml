# Open item: membership in anthropic-plugin-directory is not checked for this plugin. Task 28 confirms it.
id = "claude-md-management"
title = "Claude MD Management"
kind = "plugin"
hosts = ["claude"]
needs_login = false
telemetry_default_off = true

[minimum_host]
claude = "2.1.330"

[[install.claude]]
plugin = "claude-md-management@anthropic-plugin-directory"

[probe.claude]
argv = ["claude", "plugin", "list"]
expect = "claude-md-management"
