# No install step: relaxkit runs ccusage through npx at the pinned version, and every invocation passes --offline,
# because the pricing fetch is the one network path (spike A A9 item 12).
id = "ccusage"
title = "ccusage"
kind = "npm"
hosts = ["claude", "opencode"]
needs_login = false
telemetry_default_off = true

[version]
npm = "ccusage"
pin = "20.0.51"

[minimum_host]
claude = "2.1.330"
opencode = "2.2.6"

[probe.claude]
argv = ["{npx}", "-y", "ccusage@{version}", "--offline", "--help"]

[probe.opencode]
argv = ["{npx}", "-y", "ccusage@{version}", "--offline", "--help"]
