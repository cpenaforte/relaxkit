name: release

# Runs on a version tag such as v0.1.0. Builds the four release targets, packages each as
# relaxkit-<version>-<target>.tar.gz, writes the checksums file, signs it with minisign, verifies the signature against
# the public key committed in release/minisign.pub, and only then publishes the GitHub release.
#
# Secret: MINISIGN_KEY, the minisign secret key. The owner generates it once with `minisign -G -W` (no password, since
# this job cannot prompt) and stores it in the repository settings. It is never printed and never written to the repo.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the Cargo.toml version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$version" != "$cargo_version" ]; then
            echo "tag $TAG does not match the Cargo.toml version $cargo_version" >&2
            exit 1
          fi

  build:
    needs: [check-version]
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          mkdir -p dist
          # The archive holds the binary at its root, as the self-update step expects.
          tar -C "target/$TARGET/release" -czf "dist/relaxkit-$version-$TARGET.tar.gz" relaxkit
      - uses: actions/upload-artifact@v4
        with:
          name: relaxkit-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: relaxkit-*
          path: dist
          merge-multiple: true
      - name: Checksums
        env:
          TAG: ${{ github.ref_name }}
        working-directory: dist
        run: |
          version=${TAG#v}
          count=$(ls relaxkit-"$version"-*.tar.gz | wc -l | tr -d ' ')
          if [ "$count" != "4" ]; then
            echo "expected 4 release archives, found $count" >&2
            exit 1
          fi
          sha256sum relaxkit-"$version"-*.tar.gz > "relaxkit-$version-checksums.txt"
          cat "relaxkit-$version-checksums.txt"
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Sign the checksums
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          TAG: ${{ github.ref_name }}
        working-directory: dist
        run: |
          version=${TAG#v}
          key="$RUNNER_TEMP/minisign.key"
          umask 077
          printf '%s\n' "$MINISIGN_KEY" > "$key"
          # </dev/null: an encrypted key fails here instead of waiting for a password.
          minisign -S -s "$key" -t "relaxkit $version" -m "relaxkit-$version-checksums.txt" < /dev/null
          rm -f "$key"
      - name: Verify the signature against the committed public key
        env:
          TAG: ${{ github.ref_name }}
        working-directory: dist
        run: |
          version=${TAG#v}
          minisign -Vm "relaxkit-$version-checksums.txt" -p "$GITHUB_WORKSPACE/release/minisign.pub"
      - name: Verify every archive against the checksums
        env:
          TAG: ${{ github.ref_name }}
        working-directory: dist
        run: |
          version=${TAG#v}
          sha256sum -c "relaxkit-$version-checksums.txt"
      - name: Render the Homebrew formula
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          sh scripts/render-formula.sh "$version" "dist/relaxkit-$version-checksums.txt" > "dist/relaxkit.rb"
          ruby -c "dist/relaxkit.rb"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        working-directory: dist
        run: |
          version=${TAG#v}
          gh release create "$TAG" --verify-tag --title "relaxkit $version" --generate-notes \
            "relaxkit-$version-x86_64-unknown-linux-musl.tar.gz" \
            "relaxkit-$version-aarch64-unknown-linux-musl.tar.gz" \
            "relaxkit-$version-x86_64-apple-darwin.tar.gz" \
            "relaxkit-$version-aarch64-apple-darwin.tar.gz" \
            "relaxkit-$version-checksums.txt" \
            "relaxkit-$version-checksums.txt.minisig" \
            "relaxkit.rb"
