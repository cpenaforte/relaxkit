name: Feature request
description: Suggest a change or a new capability
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should relaxkit do instead?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you have tried, or considered, to solve the problem.
